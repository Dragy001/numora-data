# Codzienna aktualizacja wyników losowań dla aplikacji Numora.
name: Aktualizacja wyników

on:
  schedule:
    # Godziny w UTC. 21:15 UTC = 23:15 w Polsce latem / 22:15 zimą — po losowaniach o 21:00–22:00.
    - cron: "15 21 * * *"
    # Druga próba rano (05:30 UTC), gdyby archiwum wieczorem nie było jeszcze uzupełnione.
    - cron: "30 5 * * *"
  # Ręczne uruchomienie z zakładki Actions.
  workflow_dispatch:

# Akcja zapisuje zmiany w repozytorium.
permissions:
  contents: write

# Nie uruchamiamy dwóch aktualizacji naraz.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pobranie nowych losowań
        run: python3 scripts/update.py
      - name: Zapis zmian
        run: |
          if git diff --quiet; then
            echo "Brak nowych losowań."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Nowe wyniki losowań $(date -u +%Y-%m-%d)"
          git push
